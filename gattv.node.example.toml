[node]
name = "kitchen"
listen_host = "0.0.0.0"
listen_port = 8766
hub_url = "http://192.168.1.10:8765"
shared_token = "replace-with-a-long-random-secret"

[camera]
index = 0
width = 1280
height = 720
fps = 15
warmup_frames = 15
clip_seconds = 10

[motion]
pre_seconds = 5
post_seconds = 5
cooldown_seconds = 60
detection_fps = 5
resize_width = 320
sensitivity = 25
changed_pixels = 150
consecutive_frames = 2
mode = "notify"
